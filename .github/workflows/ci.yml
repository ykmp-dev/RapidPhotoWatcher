name: CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RapidPhotoWatcher.AvaloniaUI/RapidPhotoWatcher.AvaloniaUI.csproj

    - name: Build
      run: dotnet build RapidPhotoWatcher.AvaloniaUI/RapidPhotoWatcher.AvaloniaUI.csproj --configuration Release --no-restore

    - name: Test build output
      run: |
        if (Test-Path "./RapidPhotoWatcher.AvaloniaUI/bin/Release/net8.0/RapidPhotoWatcher.AvaloniaUI.dll") {
          Write-Host "Build successful - output assembly created"
        } else {
          Write-Host "Build failed - output assembly not found"
          exit 1
        }

    - name: Validate installer PowerShell scripts
      shell: pwsh
      run: |
        $hadError = $false
        foreach ($script in Get-ChildItem Installer/*.ps1) {
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) {
            $hadError = $true
            Write-Host "Syntax errors in $($script.Name):"
            $errors | ForEach-Object { Write-Host ("  line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
          } else {
            Write-Host "OK: $($script.Name)"
          }
        }
        if ($hadError) { exit 1 }
